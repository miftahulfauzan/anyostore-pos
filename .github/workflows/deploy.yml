name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character SHA with successful push CI on main (also for retry/rollback)
        required: true
        type: string

permissions:
  contents: read
  actions: read

# One release at a time, including manual runs. Never cancel an in-flight SSH release.
concurrency:
  group: anyostore-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # The workflow code is from its trusted main snapshot; the target SHA is
      # validated before any server credentials are made available to a step.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.inputs.sha }}
          persist-credentials: false
      - name: Verify successful CI for the exact requested SHA
        id: ci
        uses: actions/github-script@v7
        with:
          script: |
            const { verifyCi } = require('./scripts/deploy/verify-ci.cjs');
            const result = await verifyCi({ github, context });
            core.setOutput('sha', result.sha);
            core.setOutput('mode', result.mode);
            core.info(`Deploy ${result.sha}, validated by CI run ${result.runId}`);
      - name: Deploy verified release to VPS
        env:
          DEPLOY_SHA: ${{ steps.ci.outputs.sha }}
          DEPLOY_MODE: ${{ steps.ci.outputs.mode }}
          # VPS_HOST may be an IP or hostname, but the preflight below requires
          # it to resolve to the same public IP that serves anyostore.my.id.
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$DEPLOY_MODE" = automatic || "$DEPLOY_MODE" = manual ]]
          [[ -n "$VPS_HOST" ]] || { echo "::error::VPS_HOST secret is empty"; exit 1; }
          deploy_ssh_dir=$(mktemp -d)
          deploy_log="$deploy_ssh_dir/release.log"
          trap 'rm -f "$deploy_ssh_dir/key" "$deploy_ssh_dir/known_hosts" "$deploy_log"; rmdir "$deploy_ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$deploy_ssh_dir/key"
          chmod 600 "$deploy_ssh_dir/key"
          ssh_opts=(
            -i "$deploy_ssh_dir/key"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$deploy_ssh_dir/known_hosts"
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=6
            -o ConnectTimeout=15
            -o LogLevel=ERROR
          )
          expected_ips=$(getent ahostsv4 "$VPS_HOST" | awk '{print $1}' | sort -u)
          [[ -n "$expected_ips" ]] || { echo "::error::Production hostname did not resolve: $VPS_HOST"; exit 1; }
          remote_ip=$(ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" 'curl -4fsS --max-time 10 https://api.ipify.org')
          if ! grep -Fxq "$remote_ip" <<< "$expected_ips"; then
            echo "::error title=Production SSH target mismatch::SSH host $VPS_HOST resolved to [$expected_ips], but the connected server reports public IP $remote_ip"
            exit 1
          fi
          echo "Verified SSH target $VPS_HOST -> $remote_ip"
          set +e
          ssh "${ssh_opts[@]}" \
              "$VPS_USER@$VPS_HOST" "EXPECTED_APP_DOMAIN=anyostore.my.id DEPLOY_DIR=/home/ubuntu/anyostore-pos bash -s -- $DEPLOY_SHA $DEPLOY_MODE" < scripts/deploy/release.sh 2>&1 | tee "$deploy_log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            detail=$(tail -100 "$deploy_log" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=VPS deployment output::$detail"
            exit "$status"
          fi
      - name: Verify public production release
        env:
          DEPLOY_SHA: ${{ steps.ci.outputs.sha }}
        run: |
          set -euo pipefail
          verify_public_endpoint() {
            local endpoint=$1
            local attempt body
            for attempt in $(seq 1 4); do
              if body=$(curl --fail --silent --show-error --proto '=https' --connect-timeout 3 --max-time 5 \
                -H 'Cache-Control: no-cache' "https://anyostore.my.id${endpoint}?release=${DEPLOY_SHA}"); then
                if printf '%s' "$body" | python3 -c '
                import json, sys
                try:
                    body = json.load(sys.stdin)
                    valid = isinstance(body, dict) and body.get("release_sha") == sys.argv[1]
                    if sys.argv[2] == "/api/health":
                        valid = valid and body.get("ok") is True
                    sys.exit(0 if valid else 1)
                except (ValueError, TypeError):
                    sys.exit(1)
                ' "$DEPLOY_SHA" "$endpoint"; then
                  echo "Verified public ${endpoint} at ${DEPLOY_SHA}"
                  return 0
                fi
              fi
              if (( attempt < 4 )); then sleep 2; fi
            done
            echo "Public ${endpoint} did not serve ${DEPLOY_SHA}" >&2
            exit 1
          }
          verify_public_endpoint /api/health
          verify_public_endpoint /version
      - name: Record verified release in the run summary
        env:
          DEPLOY_SHA: ${{ steps.ci.outputs.sha }}
        run: printf 'Verified backend and frontend release `%s`\n' "$DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
