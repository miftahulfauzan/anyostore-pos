name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Backend tests use shared in-process DB stubs; serialize files so the
      # release gate is deterministic on GitHub-hosted runners.
      - run: npm test -- --test-concurrency=1
      - run: npm audit --omit=dev

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Test release gating, health checks and workflow YAML
        run: node --test ../scripts/deploy/test/*.test.cjs
      - run: npm run build
        env:
          RELEASE_SHA: ${{ github.sha }}
          NEXT_PUBLIC_RELEASE_SHA: ${{ github.sha }}
      - run: npm audit --omit=dev
