name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Backend tests use shared in-process DB stubs; serialize files so the
      # release gate is deterministic on GitHub-hosted runners. Keep the
      # failing tail in an annotation because public job logs are restricted.
      - name: Run backend tests
        run: |
          set +e
          npm test -- --test-concurrency=1 2>&1 | tee "$RUNNER_TEMP/backend-test.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            detail=$(grep -n -A24 -B4 '^not ok' "$RUNNER_TEMP/backend-test.log" | tail -120 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Backend test output::$detail"
            exit "$status"
          fi
      - run: npm audit --omit=dev

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Test release gating, health checks and workflow YAML
        run: node --test ../scripts/deploy/test/*.test.cjs
      - run: npm run build
        env:
          RELEASE_SHA: ${{ github.sha }}
          NEXT_PUBLIC_RELEASE_SHA: ${{ github.sha }}
      - run: npm audit --omit=dev

  mobile:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib
      - run: flutter analyze lib
  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: anyostore-pos-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
