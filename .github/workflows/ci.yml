name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Backend tests use shared in-process DB stubs; serialize files so the
      # release gate is deterministic on GitHub-hosted runners.
      - run: npm test -- --test-concurrency=1
      - run: npm audit --omit=dev

  # Test integrasi terhadap MySQL SUNGGUHAN. Job backend di atas memakai stub
  # SQL buatan tangan, sehingga query yang salah (kolom hilang, JOIN keliru)
  # hanya ketahuan di produksi. Ini juga memvalidasi bahwa schema.sql plus
  # SELURUH migrasi benar-benar dapat dijalankan berurutan.
  backend-mysql:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pos_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run MySQL integration tests
        env:
          MYSQL_TEST_URL: mysql://root:root@127.0.0.1:3306/pos_test
        run: node --test test/mysql-integration.test.js

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Test release gating, health checks and workflow YAML
        run: node --test ../scripts/deploy/test/*.test.cjs
      - name: Test stock dashboard dates and refresh
        run: node --test test/dashboard-movement-dates.test.cjs
      - name: Run frontend regression tests
        run: node --test test/*.test.cjs
      - run: npm run e2e
      - run: npm run build
        env:
          RELEASE_SHA: ${{ github.sha }}
          NEXT_PUBLIC_RELEASE_SHA: ${{ github.sha }}
      - run: npm audit --omit=dev
