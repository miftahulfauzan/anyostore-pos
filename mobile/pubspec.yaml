name: pos_pakaian_mobile
description: POS Pakaian mobile companion app
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  connectivity_plus: ^6.0.5
  bluetooth_print_plus: ^2.0.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  share_plus: ^10.0.0
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  path: ^1.9.0
  path_provider: ^2.1.4
  mobile_scanner: ^7.0.0
  fl_chart: ^0.70.2

dependency_overrides:
  bluetooth_print_plus:
    path: plugins/bluetooth_print_plus

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
